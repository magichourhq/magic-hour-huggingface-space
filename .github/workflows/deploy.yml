# Uploads the app to the Hugging Face Space on every push to main. Run it manually to deploy again.
# Needs an HF_TOKEN secret with write access to the Space.
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.4.0
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload magichourhq/magic-hour . --repo-type space \
            --exclude ".git/*" --exclude ".github/*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub"
